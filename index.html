<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مواعيد وحجز الملعب الخماسي</title>
  
  <!-- Google Fonts: Cairo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- QRCode.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    * { font-family: 'Cairo', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-10">

  <!-- الهيدر -->
  <header class="bg-gradient-to-l from-indigo-900 via-indigo-800 to-blue-900 text-white shadow-lg sticky top-0 z-30">
    <div class="max-w-5xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-3">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-full bg-amber-400 text-indigo-950 flex items-center justify-center text-2xl shadow-md">
          <i class="fa-solid fa-futbol"></i>
        </div>
        <div>
          <h1 class="text-xl font-extrabold tracking-wide">الملعب الخماسي</h1>
          <p class="text-xs text-emerald-300 font-semibold">جدول المواعيد المتاحة والحجز المباشر</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="openQrModal()" class="bg-white/15 hover:bg-white/25 text-white px-3 py-2 rounded-xl text-xs font-bold flex items-center gap-2 transition">
          <i class="fa-solid fa-qrcode text-amber-400"></i> مشاركة QR
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 mt-5">

    <!-- شريط أرقام التواصل السريع الثابت -->
    <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 mb-5">
      <div class="text-center text-xs font-bold text-slate-500 mb-3">للاستفسار أو الحجز السريع عبر الواتساب أو الاتصال المباشر:</div>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        
        <!-- الرقم الأول -->
        <div class="flex items-center justify-between bg-slate-50 border border-slate-200 rounded-xl p-2.5">
          <div class="flex items-center gap-2">
            <span class="w-8 h-8 rounded-lg bg-indigo-100 text-indigo-700 flex items-center justify-center font-bold text-sm">1</span>
            <span class="font-extrabold text-sm text-slate-800" dir="ltr">0100 810 9557</span>
          </div>
          <div class="flex gap-1.5">
            <a href="https://wa.me/201008109557" target="_blank" class="bg-emerald-500 hover:bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1 transition">
              <i class="fa-brands fa-whatsapp text-sm"></i> واتساب
            </a>
            <a href="tel:01008109557" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1 transition">
              <i class="fa-solid fa-phone"></i> اتصال
            </a>
          </div>
        </div>

        <!-- الرقم الثاني -->
        <div class="flex items-center justify-between bg-slate-50 border border-slate-200 rounded-xl p-2.5">
          <div class="flex items-center gap-2">
            <span class="w-8 h-8 rounded-lg bg-amber-100 text-amber-700 flex items-center justify-center font-bold text-sm">2</span>
            <span class="font-extrabold text-sm text-slate-800" dir="ltr">0114 285 7955</span>
          </div>
          <div class="flex gap-1.5">
            <a href="https://wa.me/201142857955" target="_blank" class="bg-emerald-500 hover:bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1 transition">
              <i class="fa-brands fa-whatsapp text-sm"></i> واتساب
            </a>
            <a href="tel:01142857955" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1 transition">
              <i class="fa-solid fa-phone"></i> اتصال
            </a>
          </div>
        </div>

      </div>
    </div>

    <!-- اختيار التاريخ -->
    <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 mb-5 flex flex-wrap justify-center items-center gap-3">
      <label class="text-indigo-700 font-bold text-sm flex items-center gap-1.5">
        <i class="fa-solid fa-calendar-days"></i> اختر اليوم:
      </label>
      <input type="date" id="selectedDate" onchange="loadBookings()" class="px-4 py-2 rounded-xl border border-slate-300 bg-slate-50 font-bold text-sm outline-none focus:border-indigo-500">
      <div id="dayDisplay" class="bg-amber-400 text-slate-900 px-4 py-2 rounded-xl font-extrabold text-sm shadow-sm"></div>
      <button onclick="loadBookings()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl font-bold text-sm flex items-center gap-1.5 transition shadow-sm">
        <i class="fa-solid fa-rotate"></i> تحديث
      </button>
    </div>

    <!-- شبكة المواعيد -->
    <div id="slotsContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>

  </main>

  <!-- نافذة كود QR -->
  <div id="qrModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex justify-center items-center p-4">
    <div class="bg-white rounded-2xl max-w-sm w-full p-6 text-center relative shadow-2xl">
      <button onclick="closeQrModal()" class="absolute left-4 top-4 text-slate-400 hover:text-slate-700 text-2xl">&times;</button>
      <h3 class="text-lg font-extrabold text-indigo-900 mb-1">كود QR جدول المواعيد</h3>
      <p class="text-xs text-slate-500 mb-4">امسح الكود بالكاميرا لفتح صفحة المواعيد مباشرة</p>
      <div id="qrcode" class="flex justify-center p-4 bg-slate-50 rounded-xl border border-slate-200 mb-4"></div>
      <button onclick="copyPageUrl()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2.5 rounded-xl font-bold text-sm flex justify-center items-center gap-2 transition">
        <i class="fa-solid fa-copy"></i> نسخ رابط الصفحة
      </button>
    </div>
  </div>

  <script>
    // ⚠️ هام: ضع رابط الـ Web App الخاص بك من Google Apps Script هنا (الذي ينتهي بـ /exec)
    const GAS_API_URL = "ضع_هنا_رابط_الويب_آب_الخاص_بك_الذي_ينتهي_بـ_exec";

    const PHONE_1 = "201008109557";
    const PHONE_2 = "201142857955";

    window.onload = function() {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('selectedDate').value = today;
      loadBookings();
    };

    function getArabicDayName(dateString) {
      const days = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
      const parts = dateString.split('-');
      const d = new Date(parts[0], parts[1] - 1, parts[2]);
      return days[d.getDay()];
    }

    async function loadBookings() {
      const dateVal = document.getElementById('selectedDate').value;
      if (!dateVal) return;

      const dayName = getArabicDayName(dateVal);
      document.getElementById('dayDisplay').innerText = `${dayName} (${dateVal})`;
      
      const container = document.getElementById('slotsContainer');
      container.innerHTML = `
        <div class="col-span-full text-center py-12 text-indigo-600 font-bold">
          <i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i>
          <div>جاري تحميل المواعيد المتاحة...</div>
        </div>
      `;

      try {
        const response = await fetch(`${GAS_API_URL}?action=getSlots&date=${encodeURIComponent(dateVal)}`);
        const slots = await response.json();
        renderSlots(slots, dateVal, dayName);
      } catch (error) {
        container.innerHTML = `
          <div class="col-span-full bg-red-50 border border-red-200 text-red-700 p-4 rounded-xl text-center font-bold text-sm">
            تعذر الاتصال بالجدول. تأكد من وضع رابط الـ Web App الصحيح في الكود وتعيين صلاحية الوصول إلى Anyone.
          </div>
        `;
      }
    }

    function renderSlots(slots, dateVal, dayName) {
      const container = document.getElementById('slotsContainer');
      container.innerHTML = '';

      slots.forEach(s => {
        const slotTitle = s.displaySlot || s.slot;
        const card = document.createElement('div');

        if (s.isBooked) {
          card.className = "bg-rose-50/70 rounded-2xl p-4 border-r-4 border-rose-500 border border-rose-100 shadow-sm";
          card.innerHTML = `
            <div class="flex justify-between items-center pb-2.5 mb-2.5 border-b border-rose-100">
              <span class="font-extrabold text-slate-700 text-sm flex items-center gap-1.5">
                <i class="fa-regular fa-clock text-rose-500"></i> ${slotTitle}
              </span>
              <span class="bg-rose-100 text-rose-700 text-xs px-2.5 py-1 rounded-full font-bold">
                <i class="fa-solid fa-lock"></i> محجوز
              </span>
            </div>
            <div class="text-center text-xs text-slate-400 font-semibold py-3">
              هذا الموعد محجوز بالفعل
            </div>
          `;
        } else {
          const waMsg = encodeURIComponent(`السلام عليكم، عاوز أحجز الملعب يوم ${dayName} (${dateVal}) في الموعد: ${slotTitle}`);
          const waUrl1 = `https://wa.me/${PHONE_1}?text=${waMsg}`;
          const waUrl2 = `https://wa.me/${PHONE_2}?text=${waMsg}`;

          card.className = "bg-white rounded-2xl p-4 border-r-4 border-emerald-500 border border-slate-200 shadow-sm hover:shadow-md transition";
          card.innerHTML = `
            <div class="flex justify-between items-center pb-2.5 mb-2.5 border-b border-slate-100">
              <span class="font-extrabold text-indigo-800 text-sm flex items-center gap-1.5">
                <i class="fa-regular fa-clock text-emerald-600"></i> ${slotTitle}
              </span>
              <span class="bg-emerald-100 text-emerald-800 text-xs px-2.5 py-1 rounded-full font-bold">
                متاح
              </span>
            </div>
            <div class="text-xs text-slate-500 font-semibold mb-3 flex items-center gap-1.5">
              <i class="fa-solid fa-tag text-amber-500"></i> السعر: 170 ج / ساعة
            </div>
            
            <div class="space-y-1.5">
              <a href="${waUrl1}" target="_blank" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white py-2 px-3 rounded-xl font-bold text-xs flex justify-center items-center gap-1.5 transition">
                <i class="fa-brands fa-whatsapp text-base"></i> حجز واتساب (01008109557)
              </a>
              <a href="${waUrl2}" target="_blank" class="w-full bg-teal-600 hover:bg-teal-700 text-white py-2 px-3 rounded-xl font-bold text-xs flex justify-center items-center gap-1.5 transition">
                <i class="fa-brands fa-whatsapp text-base"></i> حجز واتساب (01142857955)
              </a>
              <div class="grid grid-cols-2 gap-1.5 pt-1">
                <a href="tel:01008109557" class="bg-slate-100 hover:bg-slate-200 text-slate-700 py-1.5 rounded-lg font-bold text-[11px] flex justify-center items-center gap-1 transition">
                  <i class="fa-solid fa-phone text-indigo-600"></i> اتصال 1
                </a>
                <a href="tel:01142857955" class="bg-slate-100 hover:bg-slate-200 text-slate-700 py-1.5 rounded-lg font-bold text-[11px] flex justify-center items-center gap-1 transition">
                  <i class="fa-solid fa-phone text-indigo-600"></i> اتصال 2
                </a>
              </div>
            </div>
          `;
        }
        container.appendChild(card);
      });
    }

    let qrGenerated = false;
    function openQrModal() {
      document.getElementById('qrModal').classList.remove('hidden');
      if (!qrGenerated) {
        new QRCode(document.getElementById("qrcode"), {
          text: window.location.href,
          width: 200,
          height: 200
        });
        qrGenerated = true;
      }
    }

    function closeQrModal() {
      document.getElementById('qrModal').classList.add('hidden');
    }

    function copyPageUrl() {
      navigator.clipboard.writeText(window.location.href);
      alert("تم نسخ رابط الصفحة بنجاح!");
    }
  </script>
</body>
</html>
